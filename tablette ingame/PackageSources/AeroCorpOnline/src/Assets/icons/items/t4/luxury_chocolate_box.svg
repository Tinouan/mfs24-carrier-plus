<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Luxury Chocolate Box - gift box with ribbon -->
  <rect x="8" y="18" width="32" height="20" rx="3" fill="#78350f"/>
  <rect x="8" y="18" width="32" height="20" rx="3" stroke="#92400e" stroke-width="1"/>
  <!-- Lid -->
  <rect x="6" y="14" width="36" height="6" rx="3" fill="#92400e"/>
  <rect x="6" y="14" width="36" height="6" rx="3" stroke="#78350f" stroke-width="1"/>
  <!-- Gold ribbon vertical -->
  <rect x="22" y="14" width="4" height="24" fill="#f59e0b" opacity="0.5"/>
  <!-- Gold ribbon horizontal -->
  <rect x="6" y="16" width="36" height="2" fill="#f59e0b" opacity="0.5"/>
  <!-- Bow -->
  <ellipse cx="21" cy="13" rx="4" ry="3" fill="#f59e0b" opacity="0.7"/>
  <ellipse cx="27" cy="13" rx="4" ry="3" fill="#f59e0b" opacity="0.7"/>
  <circle cx="24" cy="13" r="1.5" fill="#d97706"/>
  <!-- Chocolates inside hint -->
  <circle cx="14" cy="28" r="2.5" fill="#451a03"/>
  <circle cx="20" cy="28" r="2.5" fill="#451a03"/>
  <circle cx="28" cy="28" r="2.5" fill="#451a03"/>
  <circle cx="34" cy="28" r="2.5" fill="#451a03"/>
  <circle cx="17" cy="34" r="2.5" fill="#451a03"/>
  <circle cx="24" cy="34" r="2.5" fill="#451a03"/>
  <circle cx="31" cy="34" r="2.5" fill="#451a03"/>
</svg>
