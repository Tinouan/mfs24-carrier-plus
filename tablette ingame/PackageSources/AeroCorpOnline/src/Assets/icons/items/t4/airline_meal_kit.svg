<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Airline Meal Kit - tray with compartments -->
  <rect x="6" y="14" width="36" height="24" rx="3" fill="#475569"/>
  <rect x="6" y="14" width="36" height="24" rx="3" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Main compartment -->
  <rect x="9" y="17" width="16" height="12" rx="2" fill="#1e293b"/>
  <!-- Meat/protein -->
  <ellipse cx="14" cy="22" rx="3" ry="2" fill="#be123c"/>
  <path d="M12 21 Q14 19, 16 21" stroke="#f87171" stroke-width="0.5"/>
  <!-- Veggies -->
  <circle cx="20" cy="20" r="1.5" fill="#22c55e"/>
  <circle cx="22" cy="22" r="1" fill="#16a34a"/>
  <!-- Side compartment -->
  <rect x="28" y="17" width="11" height="5" rx="1.5" fill="#1e293b"/>
  <rect x="29" y="18" width="9" height="3" rx="1" fill="#fbbf24" opacity="0.5"/>
  <!-- Dessert compartment -->
  <rect x="28" y="24" width="11" height="5" rx="1.5" fill="#1e293b"/>
  <circle cx="33" cy="26.5" r="2" fill="#92400e"/>
  <!-- Drink -->
  <rect x="9" y="31" width="5" height="4" rx="1" fill="#1e293b"/>
  <rect x="9" y="33" width="5" height="2" rx="0.5" fill="#f97316" opacity="0.6"/>
  <!-- Cutlery -->
  <line x1="18" y1="32" x2="18" y2="36" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="32" x2="22" y2="36" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M22 32 Q23 31, 22 30" stroke="#cbd5e1" stroke-width="0.8"/>
  <!-- Foil lid hint -->
  <line x1="6" y1="14" x2="42" y2="14" stroke="#cbd5e1" stroke-width="0.5"/>
</svg>
