<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Artisan Cheese Platter - wooden board with cheeses -->
  <ellipse cx="24" cy="30" rx="18" ry="8" fill="#92400e"/>
  <ellipse cx="24" cy="28" rx="18" ry="8" fill="#a16207"/>
  <!-- Grain lines on board -->
  <path d="M8 28 Q16 26, 24 28 Q32 30, 40 28" stroke="#78350f" stroke-width="0.5"/>
  <!-- Aged cheese triangle -->
  <path d="M12 24 L18 16 L24 24Z" fill="#ca8a04"/>
  <circle cx="16" cy="21" r="1" fill="#a16207"/>
  <circle cx="19" cy="22" r="0.8" fill="#a16207"/>
  <!-- Cheese wheel slice -->
  <path d="M26 20 L34 18 L34 26 L26 26Z" fill="#facc15" stroke="#eab308" stroke-width="0.5"/>
  <circle cx="30" cy="22" r="1" fill="#eab308"/>
  <!-- Small round cheese -->
  <circle cx="20" cy="28" r="3" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <!-- Grapes decoration -->
  <circle cx="34" cy="26" r="1.5" fill="#7c3aed" opacity="0.7"/>
  <circle cx="36" cy="25" r="1.5" fill="#7c3aed" opacity="0.7"/>
  <circle cx="35" cy="27.5" r="1.5" fill="#6d28d9" opacity="0.7"/>
  <!-- Leaf -->
  <path d="M36 23 Q38 21, 37 24" fill="#22c55e"/>
</svg>
