<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Royal Banquet Set - grand dome platter with crown -->
  <!-- Base plate -->
  <ellipse cx="24" cy="36" rx="18" ry="5" fill="#d97706"/>
  <ellipse cx="24" cy="34" rx="18" ry="5" fill="#f59e0b"/>
  <!-- Dome -->
  <path d="M8 34 Q8 12, 24 8 Q40 12, 40 34" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <!-- Dome shine -->
  <path d="M14 26 Q18 16, 24 14" stroke="#fff" stroke-width="1.5" opacity="0.4" fill="none"/>
  <!-- Crown on top -->
  <path d="M18 8 L20 4 L22 7 L24 2 L26 7 L28 4 L30 8Z" fill="#f59e0b" stroke="#d97706" stroke-width="0.8"/>
  <circle cx="24" cy="2" r="1" fill="#ef4444"/>
  <circle cx="20" cy="4" r="0.8" fill="#3b82f6"/>
  <circle cx="28" cy="4" r="0.8" fill="#22c55e"/>
  <!-- Gold trim on dome base -->
  <ellipse cx="24" cy="34" rx="16" ry="2" fill="none" stroke="#f59e0b" stroke-width="1"/>
  <!-- Stars -->
  <text x="16" y="26" fill="#f59e0b" font-size="6" opacity="0.4">&#x2605;</text>
  <text x="30" y="22" fill="#f59e0b" font-size="5" opacity="0.3">&#x2605;</text>
</svg>
